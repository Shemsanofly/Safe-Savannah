# Local PostgreSQL for development. The app itself runs on the host laptop
# (it needs the camera / video file and ffmpeg).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: savannah
      POSTGRES_PASSWORD: savannah
      POSTGRES_DB: safe_savannah
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U savannah -d safe_savannah"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
